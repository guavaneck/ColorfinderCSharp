<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ColorFinder</title>
  <style>
    :root { color-scheme:dark; --bg:#111318; --surface:#1a1d24; --surface2:#232730; --text:#eef1f6; --muted:#9299a8; --accent:#74a2ff; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    body { margin:0; overflow:hidden; background:#111318; background:var(--bg); color:#eef1f6; color:var(--text); font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; }
    button { border:0; border-radius:7px; background:#232730; background:var(--surface2); color:inherit; font:inherit; padding:8px 11px; cursor:pointer; }
    button:disabled { opacity:.35; cursor:default; }
    button:hover:not(:disabled), button.active { background:#343a48; }
    .toolbar { height:58px; display:flex; align-items:center; gap:16px; padding:10px 14px; background:#1a1d24; background:var(--surface); border-bottom:1px solid #2b303a; }
    .toolbar nav { display:flex; flex:0 0 auto; gap:5px; }
    .toolbar nav button { font-size:22px; line-height:20px; min-width:36px; }
    .path { flex:1 1 auto; min-width:80px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; background:#101217; border:1px solid #303541; border-radius:8px; padding:9px 12px; }
    .view-toggle { display:flex; flex:0 0 auto; gap:3px; }
    main { height:calc(100% - 58px); display:grid; grid-template-columns:190px minmax(0,1fr); }
    aside { padding:20px 14px; background:#171a20; border-right:1px solid #292d36; overflow:hidden; }
    aside h2 { color:#9299a8; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:0 8px 10px; }
    .sidebar-link { width:100%; text-align:left; background:transparent; }
    .hint { margin:28px 9px; color:#9299a8; color:var(--muted); font-size:12px; line-height:1.5; }
    .browser { position:relative; min-width:0; min-height:0; overflow:hidden; }
    .entries { height:calc(100% - 66px); overflow:auto; padding:20px; align-content:start; }
    .entries.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:12px; }
    .entry { position:relative; min-width:0; border:1px solid transparent; border-radius:10px; background:transparent; color:inherit; text-align:center; padding:14px 8px 11px; }
    .entry:hover { background:#1c2028; }
    .entry.selected { border-color:#74a2ff; border-color:var(--accent); background:#222a39; }
    .entry .icon { display:block; font-size:42px; margin-bottom:8px; }
    .entry .name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .entry .kind, .entry .modified { display:none; color:#9299a8; color:var(--muted); }
    .tag { position:absolute; top:10px; bottom:10px; left:5px; width:5px; height:auto; margin:0; border-radius:5px; background:var(--tag,transparent); }
    .entries.list { display:block; padding:12px; }
    .entries.list .entry { width:100%; display:grid; grid-template-columns:36px minmax(100px,1fr) 100px 150px; gap:8px; align-items:center; text-align:left; padding:8px 12px; }
    .entries.list .icon { font-size:22px; margin:0; }
    .entries.list .kind, .entries.list .modified { display:block; }
    .entries.list .tag { left:4px; width:4px; }
    .color-bar { position:absolute; z-index:2; left:0; right:0; bottom:0; min-height:66px; padding:12px 20px; display:flex; align-items:center; gap:14px; background:#1a1d24; border-top:1px solid #303541; }
    .color-bar[hidden] { display:none; }
    .color-bar > span { min-width:140px; max-width:240px; overflow:hidden; text-overflow:ellipsis; color:#9299a8; color:var(--muted); }
    .color-bar div { display:flex; gap:8px; }
    .swatch { width:30px; height:30px; padding:0; border-radius:50%; background:var(--swatch); border:2px solid rgba(255,255,255,.18); }
    .swatch:hover { transform:scale(1.1); background:var(--swatch)!important; }
    #error { margin:12px; padding:12px; border-radius:8px; background:#5b2525; }
    #error[hidden] { display:none; }
    @media (max-width:800px) { main { grid-template-columns:1fr; } aside { display:none; } .view-toggle { display:none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <nav aria-label="Directory navigation">
      <button id="back" title="Back">‹</button><button id="forward" title="Forward">›</button><button id="up" title="Up">↑</button>
    </nav>
    <div id="path" class="path">Loading…</div>
    <div class="view-toggle"><button id="grid-view" class="active">Grid</button><button id="list-view">List</button></div>
  </header>
  <main>
    <aside>
      <h2>Favorites</h2>
      <button id="home-link" class="sidebar-link">⌂ Home</button>
      <div class="hint">Double-click a folder to open it. Select an item, then choose a color.</div>
    </aside>
    <section class="browser">
      <div id="error" role="alert" hidden></div>
      <div id="entries" class="entries grid" aria-live="polite"></div>
      <footer id="color-bar" class="color-bar" hidden>
        <span id="selection-label">No selection</span>
        <div id="colors"></div>
        <button id="clear-color">Clear</button>
      </footer>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
